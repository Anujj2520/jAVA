</style></head><body><header><h1>Practical Code Bank</h1><div>C++ & Java · 10 experiments</div></header><main><section class="panel"><div class="tabs"><button id="cppTab" class="active" onclick="setLang('cpp')">C++ (1–5)</button><button id="javaTab" onclick="setLang('java')">Java (6–10)</button></div><div id="topics"></div><p class="muted">Select a topic to display its code.</p></section><section class="panel"><div class="head"><div><h2 id="title"></h2><div id="filename" class="muted"></div></div><button class="copy" onclick="copyCode()">Copy Code</button></div><pre><code id="code"></code></pre><div id="status" class="muted"></div></section></main>
<script>
const experiments={cpp:[
{title:"1. Largest of 3 numbers (if-else)",file:"largest.cpp",code:`#include <iostream>
using namespace std;
int main() {
    int a, b, c;
    cout << "Enter three numbers: ";
    cin >> a >> b >> c;
    if (a >= b && a >= c)
        cout << "Largest = " << a;
    else if (b >= a && b >= c)
        cout << "Largest = " << b;
    else
        cout << "Largest = " << c;
    return 0;
}`},
{title:"2. Addition of two 2x2 matrices",file:"matrix_add.cpp",code:`#include <iostream>
using namespace std;
int main() {
    int a[2][2], b[2][2], c[2][2];
    cout << "Enter 4 elements of first matrix: ";
    for (int i=0;i<2;i++)
        for (int j=0;j<2;j++) cin >> a[i][j];
    cout << "Enter 4 elements of second matrix: ";
    for (int i=0;i<2;i++)
        for (int j=0;j<2;j++) cin >> b[i][j];
    for (int i=0;i<2;i++)
        for (int j=0;j<2;j++) c[i][j]=a[i][j]+b[i][j];
    cout << "Sum of matrices:\\n";
    for (int i=0;i<2;i++) {
        for (int j=0;j<2;j++) cout << c[i][j] << " ";
        cout << endl;
    }
    return 0;
}`},
{title:"3. Area of different shapes",file:"area_shapes.cpp",code:`#include <iostream>
using namespace std;
int main() {
    int choice;
    double r, l, b;
    cout << "1. Circle\\n2. Rectangle\\n3. Triangle\\n";
    cout << "Enter choice: ";
    cin >> choice;
    switch (choice) {
        case 1:
            cout << "Enter radius: "; cin >> r;
            cout << "Area = " << 3.14159*r*r; break;
        case 2:
            cout << "Enter length and breadth: "; cin >> l >> b;
            cout << "Area = " << l*b; break;
        case 3:
            cout << "Enter base and height: "; cin >> b >> l;
            cout << "Area = " << 0.5*b*l; break;
        default: cout << "Invalid choice";
    }
    return 0;
}`},
{title:"4. Copy constructor",file:"copy_constructor.cpp",code:`#include <iostream>
using namespace std;
class Student {
public:
    int marks;
    Student(int m) { marks=m; }
    Student(const Student &s) { marks=s.marks; }
    void display() { cout << "Marks = " << marks << endl; }
};
int main() {
    Student s1(85);
    Student s2(s1);
    cout << "Original object: "; s1.display();
    cout << "Copied object: "; s2.display();
    return 0;
}`},
{title:"5. Single inheritance",file:"single_inheritance.cpp",code:`#include <iostream>
using namespace std;
class Person {
public:
    void showName() { cout << "I am a person" << endl; }
};
class Student : public Person {
public:
    void showStudent() { cout << "I am a student" << endl; }
};
int main() {
    Student s;
    s.showName();
    s.showStudent();
    return 0;
}`}

{title:"9. AWT interface using components",file:"AWTInterface.java",code:`import java.awt.*;
import java.awt.event.*;
public class AWTInterface extends Frame {
    AWTInterface() {
        setTitle("Student Form");
        setSize(350, 200);
        setLayout(new FlowLayout());
        Label label = new Label("Enter name:");
        TextField name = new TextField(15);
        Button button = new Button("Submit");

                result.setText("Hello, " + name.getText());

        addWindowListener(new WindowAdapter() {
            public void windowClosing(WindowEvent e) { dispose(); }
        });
        setVisible(true);
    }
    public static void main(String[] args) { new AWTInterface(); }
}`},
{title:"10. Drawing shapes using AWT",file:"DrawShapes.java",code:`import java.awt.*;
import java.awt.event.*;
public class DrawShapes extends Frame {
    DrawShapes() {
        setTitle("Drawing Shapes");
        setSize(400, 300);

            public void windowClosing(WindowEvent e) { dispose(); }

        g.drawLine(50, 70, 150, 70);
        g.drawRect(50, 100, 100, 60);

let lang="cpp",idx=0;
function setLang(l){lang=l;idx=0;document.getElementById("cppTab").classList.toggle("active",l==="cpp");document.getElementById("javaTab").classList.toggle("active",l==="java");render();}
function render(){const root=document.getElementById("topics");root.innerHTML="";experiments[lang].forEach((x,i)=>{const b=document.createElement("button");b.className="topic"+(i===idx?" active":"");b.innerHTML=x.title+"<small>"+x.file+"</small>";b.onclick=()=>{idx=i;render();};root.appendChild(b);});const x=experiments[lang][idx];document.getElementById("title").textContent=x.title;document.getElementById("filename").textContent="Save as: "+x.file;document.getElementById("code").textContent=x.code;document.getElementById("status").textContent="";}
async function copyCode(){const s=experiments[lang][idx].code,st=document.getElementById("status");try{await navigator.clipboard.writeText(s);st.textContent="Copied! Paste into your editor.";}catch(e){const t=document.createElement("textarea");t.value=s;document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();st.textContent=ok?"Copied! Paste into your editor.":"Select the code manually and copy it.";}}
render();
</script></body></html>
